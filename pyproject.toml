[project]
name = "advent-of-code"
version = "1.0.0"
description = "Multi-year Advent of Code solutions with Python and uv"
readme = "README.md"
authors = [{ name = "Malte Mindedal" }]
requires-python = ">=3.11"
dependencies = ["z3-solver>=4.12.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=9.0.3", "pyright>=1.1.402", "ruff>=0.6.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["2025", "utils", "tests"]
[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "UP", "W"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"utils/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["2025", "tests", "utils"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportPrivateUsage = "none"
reportUnusedFunction = "none"
